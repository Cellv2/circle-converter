<section id="inputs">
    <form>
        <label for="diameter-input">Diameter</label>
        <input id="diameter-input" type="text" />
        <select name="diameter-unit" id="diameter-unit">
            <option value="in">in</option>
            <option value="cm">cm</option>
        </select>
        <label for="circumference-input">Circumference</label>
        <input id="circumference-input" type="text" />
        <select name="circumference" id="circumference-unit">
            <option value="in">in</option>
            <option value="cm">cm</option>
        </select>
    </form>
</section>
